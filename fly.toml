# Fly.io. Normally deployed by .github/workflows/deploy.yml, which passes --app and
# --primary-region explicitly; the values here are the defaults for running flyctl by hand.
# One machine only (--ha=false): SQLite lives on the volume and the job queue runs in-process.
app = "catch-maxsenica-sys"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8787"
  SIGNUP_MODE = "invite"

[[mounts]]
  source = "catch_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

# 512 MB: a capture holds a few screenshots in memory while it is read.
# 256 MB (Fly's default) is tight once two captures process at once.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
